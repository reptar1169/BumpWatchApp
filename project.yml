name: BumpWatch
options:
  bundleIdPrefix: com.jeffschoello.bumpwatch
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

targets:
  # Invisible iOS "container" target -- no code, no UI, never launches. Its
  # only job is to embed the real watch app below via "Embed Watch Content",
  # which is what makes Xcode Organizer offer "App Store Connect" as a
  # distribution option at all. Confirmed against a throwaway project built
  # from Xcode 26's own watchOS App template: even a fully independent,
  # watch-only app (WKWatchOnly) still needs this wrapper to be submittable.
  # It never appears as a separate app on the App Store or the iPhone --
  # WKWatchOnly is what keeps it hidden.
  BumpWatch:
    type: application.watchapp2-container
    platform: iOS
    sources: []
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BumpWatch
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "4"
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffschoello.bumpwatch
        DEVELOPMENT_TEAM: "F54YTSCT8G" # Jeff Schoellerman
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: "BumpWatch Watch App"
        embed: true

  "BumpWatch Watch App":
    type: application
    platform: watchOS
    sources:
      - "BumpWatch Watch App"
    info:
      path: "BumpWatch Watch App/Info.plist"
      properties:
        CFBundleDisplayName: BumpWatch
        WKApplication: true
        WKWatchOnly: true
        NSLocationWhenInUseUsageDescription: "BumpWatch records where bumps happen on your ride so they can be mapped."
        NSLocationAlwaysAndWhenInUseUsageDescription: "BumpWatch records where bumps happen on your ride so they can be mapped."
        NSMotionUsageDescription: "BumpWatch reads accelerometer data to detect bumps in the road."
        NSHealthShareUsageDescription: "BumpWatch starts a cycling workout session so it can keep tracking in the background."
        NSHealthUpdateUsageDescription: "BumpWatch saves your ride as a workout."
        UIBackgroundModes:
          - location
        # XcodeGen only emits exactly what's listed here -- unlike a plain
        # Xcode-created SwiftUI app, it does NOT default-add a scene
        # manifest for you. Without this, watchOS has no "Default
        # Configuration" scene entry to resolve, which is the source of the
        # "Info.plist contained no UIScene configuration dictionary
        # (looking for configuration named 'Default Configuration')"
        # warning -- and plausibly why the background workout-processing /
        # extended-runtime session machinery (which needs to relaunch a
        # scene) can't establish itself, landing HKLiveWorkoutBuilder in a
        # dead Error(7) state every time regardless of device-side state.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: "BumpWatch Watch App/BumpWatch.entitlements"
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffschoello.bumpwatch.watchkitapp
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "4"
        DEVELOPMENT_TEAM: "F54YTSCT8G" # Jeff Schoellerman
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4" # Apple Watch only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
